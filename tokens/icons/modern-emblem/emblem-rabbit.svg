<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="p-block-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="p-block-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="p-body-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <!-- Background circular disc -->
  <circle cx="60" cy="48" r="38" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>

  <!-- Parkour Architecture Modular Blocks (Ref: VectorStock 64773074) -->
  <g opacity="0.65">
    <!-- Tall vertical tower block -->
    <rect x="58" y="15" width="18" height="42" fill="url(#p-block-1)" rx="1.5"/>
    <!-- Left background mid block -->
    <rect x="33" y="26" width="27" height="30" fill="#a7f3d0" opacity="0.75" rx="1.5"/>
    <!-- Right background block -->
    <rect x="74" y="24" width="19" height="32" fill="#6ee7b7" opacity="0.55" rx="1.5"/>
    <!-- Left foreground lower block -->
    <rect x="23" y="38" width="21" height="24" fill="url(#p-block-2)" rx="1.5"/>
    <!-- Center lower platform block -->
    <rect x="54" y="47" width="41" height="20" fill="#34d399" opacity="0.38" rx="1.5"/>
    <!-- Minimalist Golden Beam Accent (Ref: VectorStock 64773074) -->
    <rect x="67" y="53" width="32" height="3" fill="#f59e0b" rx="1.2" opacity="0.9"/>
  </g>

  <!-- === PARKOUR SPRINTING RABBIT (Ref: VectorStock 64773074) === -->

  <!-- 1. Background Shadow Limbs (#94a3b8 - full sprint extension) -->
  <!-- Shadow Rear Leg (stretching far back) -->
  <path d="M 38 46
           C 32 49, 27 54, 25 56
           C 23 58, 24.5 60.5, 28 59
           C 33 57, 39 53, 46 50
           C 51 49, 53 48, 53 46 Z"
        fill="#94a3b8"/>

  <!-- Shadow Front Leg (reaching far forward) -->
  <path d="M 75 44
           C 78 42, 84 39.5, 92 38.5
           C 95.5 38, 95.5 41, 92 42.5
           C 87 44.5, 80 46.5, 74 48.5 Z"
        fill="#94a3b8"/>

  <!-- 2. Background Shadow Ear (#cbd5e1 behind head) -->
  <path d="M 67 27
           C 70 21, 75 16, 80 18
           C 82 19, 80 24, 75 30 Z"
        fill="#cbd5e1"
        stroke="#94a3b8"
        stroke-width="0.8"/>

  <!-- 3. Foreground Main White Sprinting Rabbit -->
  <!-- Body, Head & Limbs Seamless Path -->
  <path d="M 42 41
           C 40 39, 39 37, 40 35
           C 41 33.5, 43.5 34.5, 45 36.5
           C 49 35.5, 57 34.5, 68 34.5
           C 73 32, 77 29, 81 29
           C 86 29, 89 32.5, 88 36
           C 87.5 39, 84.5 40.5, 81 42
           C 78 43.5, 75 44, 78 46
           L 91 46
           C 94.5 46, 94.5 48.5, 91 49
           L 76 50
           C 71 50, 68 47.5, 65 46.5
           C 58 46.5, 53 49, 47 49
           C 41 50, 34 46, 29 48.5
           C 25 50.5, 21.5 53.5, 20.5 55
           C 19.5 56.5, 22 57.5, 24.5 55
           C 29 51.5, 35 47, 42 44.5
           C 43.5 44, 44 42.5, 42 41 Z"
        fill="url(#p-body-white)"
        stroke="#064e3b"
        stroke-width="1.8"
        stroke-linejoin="round"/>

  <!-- Underbelly Aerodynamic Shadow Accent -->
  <path d="M 47 49
           C 54 49, 61 47.5, 68 45.5
           C 71 46.5, 68 48, 65 46.5
           C 58 46.5, 53 49, 47 49 Z"
        fill="#e2e8f0"/>

  <!-- 4. Foreground Main Ear with Soft Coral Inner Tint (Ref: VectorStock 64773074) -->
  <path d="M 64 31
           C 60 25, 53 19, 60 18
           C 65 18, 73 24, 76 30 Z"
        fill="#ffffff"
        stroke="#064e3b"
        stroke-width="1.8"
        stroke-linejoin="round"/>
  <!-- Inner Ear Tint -->
  <path d="M 63 29
           C 60 24, 56 20, 60 19.5
           C 63 19.5, 69 25, 72 29 Z"
        fill="#fca5a5"
        opacity="0.8"/>

  <!-- 5. Fluffy Upright Tail (Ref: VectorStock 64773074) -->
  <path d="M 40 37
           C 38 35.5, 37 33, 39.5 32
           C 42 31, 43.5 33.5, 43 36 Z"
        fill="#ffffff"
        stroke="#064e3b"
        stroke-width="1.8"/>

  <!-- 6. Expressive Sparkle Eye & Nose Dot -->
  <circle cx="88.5" cy="35.5" r="0.9" fill="#064e3b"/>
  <circle cx="84" cy="33.5" r="1.8" fill="#064e3b"/>
  <circle cx="84.4" cy="33.1" r="0.7" fill="#ffffff"/>

  <!-- Brand Typography -->
  <text x="60" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#064e3b" letter-spacing="2.5" text-anchor="middle">SKILL-DECK</text>
  <text x="60" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="4.6" fill="#059669" letter-spacing="1.5" text-anchor="middle">― AGILE SKILLS ―</text>
</svg>