  <line x1="16" y1="44" x2="31" y2="44" stroke="#059669" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="24" y1="52" x2="34" y2="52" stroke="#10b981" stroke-width="2.8" stroke-linecap="round"/>

