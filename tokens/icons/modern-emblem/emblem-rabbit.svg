<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" role="img" aria-labelledby="rabbit-title rabbit-desc">
  <title id="rabbit-title">Skills Registry Agile Rabbit emblem</title>
  <desc id="rabbit-desc">A friendly, front-facing outlined rabbit inside a mint green badge.</desc>
  <circle cx="60" cy="49" r="41" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>

  <!-- Tall ears: hand-drawn as a new UX-Deck mark, with soft green inner lines. -->
  <path d="M48 43C44 33 38 14 42 11c4-3 11 16 15 31M72 42c4-11 10-30 14-28 4 3-2 22-7 32" fill="#fff" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M47 33c-2-7-4-14-4-17m30 17c3-8 5-14 7-17" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Rounded sitting silhouette and paws. -->
  <path d="M39 65c0-13 8-22 21-22s21 9 21 22v8c0 6-5 10-11 10H50c-6 0-11-4-11-10z" fill="#fff" stroke="#047857" stroke-width="3" stroke-linejoin="round"/>
  <path d="M45 74c-7 1-11 4-10 8 1 4 9 5 18 3m22-11c7 1 11 4 10 8-1 4-9 5-18 3" fill="#fff" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 77c2 3 5 4 10 4s8-1 10-4" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bright, simple face with a warm friendly expression. -->
  <circle cx="52" cy="59" r="2.2" fill="#064e3b"/>
  <circle cx="68" cy="59" r="2.2" fill="#064e3b"/>
  <ellipse cx="46" cy="66" rx="3.1" ry="1.8" fill="#a7f3d0"/>
  <ellipse cx="74" cy="66" rx="3.1" ry="1.8" fill="#a7f3d0"/>
  <path d="m57 64 3-2 3 2-3 3z" fill="#059669"/>
  <path d="M60 67v2m0 0c-2 2-4 2-5 1m5-1c2 2 4 2 5 1" fill="none" stroke="#047857" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M42 65h-5m5 4-5 1m41-5h5m-5 4 5 1" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>

  <text x="60" y="101" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8.5" fill="#064e3b" letter-spacing="1.7">SKILLS</text>
  <text x="60" y="111" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="4.1" fill="#059669" letter-spacing="1">― SKILLS REGISTRY ―</text>
</svg>
