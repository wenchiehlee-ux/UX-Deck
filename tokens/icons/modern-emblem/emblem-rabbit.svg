<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" role="img" aria-labelledby="rabbit-title rabbit-desc">
  <title id="rabbit-title">Skills Registry Agile Rabbit emblem</title>
  <desc id="rabbit-desc">A golden rabbit sprinting to the right, with swept-back ears, a long running stride, and three speed marks.</desc>
  <defs>
    <linearGradient id="rabbit-coat" x1="31" y1="33" x2="91" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="49" r="41" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 43h11M16 51h13M20 59h10" stroke="#fb923c" stroke-width="2.6"/>
    <!-- Low, backward-swept ears -->
    <path d="M80 40C72 34 64 30 54 29c7 6 15 10 27 14Z" fill="#fbbf24" stroke="none"/>
    <path d="M82 42C77 37 72 34 66 33c4 5 9 8 16 12Z" fill="#fb923c" stroke="none"/>
    <!-- Connected back, body, neck and head make one clear forward silhouette -->
    <path d="M34 54c6-8 15-13 26-14 8 0 15 1 21 5 2-6 6-10 12-10 5 0 8 3 9 7l4 3-4 3c-1 6-6 9-12 9-5 0-9-2-12-5-6 6-14 9-23 9-9 0-16-3-21-7Z" fill="url(#rabbit-coat)" stroke="none"/>
    <!-- Four separated, tapered legs create a long airborne sprint -->
    <path d="M49 57c-6 4-12 8-18 10l-8 1c-2 1-1 2 1 2l10 1c8-2 15-7 22-12" stroke="#f97316" stroke-width="2.8"/>
    <path d="M55 58c-5 4-9 7-14 10l-7 3c-1 1 1 2 3 2l9-3c7-3 12-7 17-12" stroke="#fbbf24" stroke-width="2.4"/>
    <path d="M76 54c6 3 12 7 18 11l8 2c2 1 1 2-1 2l-10 1c-8-2-15-7-21-12" stroke="#f97316" stroke-width="2.8"/>
    <path d="M71 57c5 4 10 7 15 9l7 3c1 1-1 2-3 2l-9-3c-7-3-12-7-17-12" stroke="#fbbf24" stroke-width="2.4"/>
  </g>
  <circle cx="94" cy="42" r="1.5" fill="#7c2d12"/>
  <circle cx="31" cy="52" r="3.5" fill="#84cc16"/>
  <text x="60" y="101" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8.5" fill="#7c2d12" letter-spacing="1.7">SKILLS</text>
  <text x="60" y="111" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="4.1" fill="#ea580c" letter-spacing="1">SKILLS REGISTRY</text>
</svg>
