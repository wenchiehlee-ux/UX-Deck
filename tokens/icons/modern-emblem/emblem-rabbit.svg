<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background block gradients matching Skill-Deck Emerald Spectrum -->
    <linearGradient id="pk-block-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1" />
      <stop offset="100%" stop-color="#99f6e4" />
    </linearGradient>
    <linearGradient id="pk-block-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="pk-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <!-- Background circular disc -->
  <circle cx="60" cy="48" r="38" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>

  <!-- === PARKOUR ARCHITECTURE GEOMETRIC BLOCKS (Ref: VectorStock 64773074) === -->
  <g opacity="0.75">
    <!-- Tall vertical tower block (top center-right) -->
    <rect x="58" y="14" width="20" height="42" fill="url(#pk-block-1)" rx="1.5"/>
    <!-- Left background mid block -->
    <rect x="30" y="25" width="30" height="32" fill="#a7f3d0" opacity="0.8" rx="1.5"/>
    <!-- Right background block -->
    <rect x="76" y="23" width="20" height="34" fill="#6ee7b7" opacity="0.6" rx="1.5"/>
    <!-- Left foreground lower block -->
    <rect x="18" y="37" width="24" height="26" fill="url(#pk-block-2)" rx="1.5"/>
    <!-- Center lower platform block -->
    <rect x="54" y="47" width="46" height="22" fill="#2dd4bf" opacity="0.35" rx="1.5"/>
    <!-- Minimalist Golden Jump Beam (Ref: VectorStock 64773074) -->
    <rect x="68" y="53" width="34" height="3.2" fill="#f59e0b" rx="1.4" opacity="0.95"/>
    <!-- Base shadow strip under blocks -->
    <rect x="36" y="60" width="42" height="6.5" fill="#0f766e" opacity="0.18" rx="1"/>
  </g>

  <!-- === PARKOUR SPRINTING RABBIT (Full Anatomical Fidelity to 64773074) === -->

  <!-- 1. Background Shadow Ear (#cbd5e1 - behind head) -->
  <path d="M 69 25
           C 72 19, 78 13.5, 83.5 16
           C 85 17, 83 23, 77 29 Z"
        fill="#94a3b8"
        stroke="#64748b"
        stroke-width="0.8"/>

  <!-- 2. Background Shadow Limbs (#85929e / muted shadow tone) -->
  <!-- Shadow Front Leg (reaching high forward - Ref: 64773074) -->
  <path d="M 76 43
           C 79 40.5, 85 37.5, 94 36.5
           C 98.5 36, 98.5 39.5, 94.5 41
           C 89 43, 82 45, 75 47.5 Z"
        fill="#85929e"/>

  <!-- Shadow Rear Leg (stretching back low - Ref: 64773074) -->
  <path d="M 36 45
           C 30 48, 24 53.5, 22 56
           C 20 58.5, 22 61, 26 59.5
           C 32 57, 39 52.5, 47 49
           C 51 48, 53 47, 53 45 Z"
        fill="#85929e"/>
  <!-- Toe crease on shadow rear foot -->
  <path d="M 23 57.5 C 24 58.5, 25.5 58.5, 27 58" stroke="#64748b" stroke-width="0.8" fill="none"/>

  <!-- 3. Foreground Main White Sprinting Rabbit Body -->
  <!-- Seamless Body Path (Aerodynamic Back, Head, Chest, Front Paw, Belly, Rear Thigh & Foot) -->
  <path d="M 40 40
           C 38 38, 36.5 36, 38 34
           C 39.5 32.5, 42 33.5, 44 35.5
           C 48 34.5, 57 33.5, 69 33.5
           C 74 31, 78.5 28, 83 28
           C 88 28, 91.5 31.5, 90 35.5
           C 89.5 38.5, 86 40, 82.5 41.5
           C 79 43, 76 43.5, 79 46
           L 93 46
           C 97 46, 97 48.8, 93 49.5
           L 77 50.5
           C 72 50.5, 69 47.8, 66 46.8
           C 59 46.8, 53 49.5, 46 49.5
           C 40 50.5, 32 46, 27 48.5
           C 22.5 50.8, 18.5 54, 17.5 56
           C 16.5 57.5, 19.5 58.8, 22 56
           C 27 52, 34 47, 41 44
           C 42.5 43.5, 43 41.8, 40 40 Z"
        fill="url(#pk-body)"
        stroke="#064e3b"
        stroke-width="1.6"
        stroke-linejoin="round"/>

  <!-- Underbelly Aerodynamic Shadow Strip (Ref: 64773074) -->
  <path d="M 46 49.5
           C 54 49.5, 62 48, 70 45.8
           C 73 46.8, 70 48.5, 66 46.8
           C 59 46.8, 53 49.5, 46 49.5 Z"
        fill="#cbd5e1"/>

  <!-- Toe Crease on Foreground Rear Foot (Ref: 64773074) -->
  <path d="M 18.5 54.5 C 19.8 55.5, 21.5 55.5, 23 55" stroke="#94a3b8" stroke-width="0.9" fill="none"/>

  <!-- 4. Foreground Main Long Ear with Coral Pink Inner Lining (Ref: 64773074) -->
  <!-- Outer Ear Shell -->
  <path d="M 66 30
           C 61 24, 53 17, 61 16
           C 66 16, 75 23, 78 29 Z"
        fill="#ffffff"
        stroke="#064e3b"
        stroke-width="1.6"
        stroke-linejoin="round"/>
  <!-- Inner Ear Velvet Pink Texture (Ref: 64773074) -->
  <path d="M 65 28
           C 61 23, 56 19, 61 18
           C 64 18, 71 24, 74 28 Z"
        fill="#fca5a5"
        stroke="#f87171"
        stroke-width="0.5"/>

  <!-- 5. Fluffy Multi-tuft Tail (Ref: 64773074) -->
  <path d="M 39 36
           C 36.5 34.5, 35.5 31.5, 38 30.5
           C 40.5 29.5, 42.5 32, 42 34.5
           C 43.5 33, 45 34.5, 44 36.5
           C 42.5 37.5, 40.5 37.5, 39 36 Z"
        fill="#ffffff"
        stroke="#064e3b"
        stroke-width="1.4"
        stroke-linejoin="round"/>

  <!-- 6. Expressive Sparkle Eye & Nose Dot (Ref: 64773074) -->
  <!-- Cute Nose -->
  <path d="M 90.5 35.5 L 90 34.8 L 91 34.8 Z" fill="#064e3b"/>
  <!-- Eye with Catchlight & Soft Eye Contour -->
  <circle cx="85" cy="33" r="2.2" fill="#064e3b"/>
  <circle cx="85.6" cy="32.4" r="0.8" fill="#ffffff"/>

  <!-- Brand Typography -->
  <text x="60" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#064e3b" letter-spacing="2.5" text-anchor="middle">SKILL-DECK</text>
  <text x="60" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="4.6" fill="#059669" letter-spacing="1.5" text-anchor="middle">― AGILE SKILLS ―</text>
</svg>