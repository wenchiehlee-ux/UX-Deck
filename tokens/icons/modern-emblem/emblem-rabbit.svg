  <!-- Brand Typography -->
  <text x="60" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#064e3b" letter-spacing="2.5" text-anchor="middle">SKILL-DECK</text>
  <text x="60" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="4.6" fill="#059669" letter-spacing="1.5" text-anchor="middle">― AGILE SKILLS ―</text>
