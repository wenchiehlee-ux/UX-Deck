  </defs>
  <!-- Background shield -->
  <path d="M 60 14 C 84 14 96 26 96 50 C 96 74 60 90 60 90 C 60 90 24 74 24 50 C 24 26 36 14 60 14 Z" fill="#fef2f2"/>
