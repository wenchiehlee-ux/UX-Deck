  <!-- Brand Typography -->
  <text x="60" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#7f1d1d" letter-spacing="3" text-anchor="middle">BULL</text>
  <text x="60" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="5" fill="#dc2626" letter-spacing="1.5" text-anchor="middle">― FINTECH ALPHA ―</text>
