<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="falcon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="falcon-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
  </defs>
  <!-- Background sunrise disc -->
  <circle cx="60" cy="48" r="38" fill="#fff7ed"/>
  <!-- Swept Soaring Wings -->
  <path d="M 60 22 C 75 14 96 16 106 25 C 98 32 88 38 78 40 C 90 41 98 48 102 56 C 90 57 80 57 70 54 L 62 60 Z" fill="url(#falcon-grad)"/>
  <path d="M 60 22 C 45 14 24 16 14 25 C 22 32 32 38 42 40 C 30 41 22 48 18 56 C 30 57 40 57 50 54 L 58 60 Z" fill="url(#falcon-dark)"/>
  <!-- Head & Hooked Beak (Facing Right) -->
  <path d="M 54 36 C 54 28 64 26 70 30 C 76 34 78 38 77 44 L 84 46 C 81 50 75 52 72 50 L 68 56 C 60 56 56 48 54 36 Z" fill="#c2410c"/>
  <!-- Sharp Eye -->
  <circle cx="67" cy="35" r="2.5" fill="#ffffff"/>
  <circle cx="68" cy="35" r="1.3" fill="#431407"/>
  <!-- Tail Fan -->
  <polygon points="56,60 64,60 68,76 60,82 52,76" fill="url(#falcon-grad)"/>
  <polygon points="58,60 62,60 64,74 60,78 56,74" fill="#ffffff" opacity="0.4"/>
  <!-- Brand Typography -->
  <text x="60" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#9a3412" letter-spacing="3" text-anchor="middle">FALCON</text>
  <text x="60" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="5" fill="#ea580c" letter-spacing="1.5" text-anchor="middle">― ALERT MANAGER ―</text>
</svg>