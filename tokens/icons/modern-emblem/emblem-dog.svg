    <!-- Soft Warm Ambient Shield -->
    <radialGradient id="shiba-shield-warm" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.35" />
