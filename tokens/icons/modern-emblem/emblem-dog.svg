      <stop offset="0%" stop-color="#f68b3e" />
      <stop offset="100%" stop-color="#e36323" />
    </linearGradient>
    <linearGradient id="shiba-tail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5853b" />
      <stop offset="100%" stop-color="#df5c1b" />
