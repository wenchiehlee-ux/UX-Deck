<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Warm Golden Shiba Coat Gradients -->
    <linearGradient id="shiba-coat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shiba-haunch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="shiba-collar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <radialGradient id="shiba-shield-aura" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0.5" />
    </radialGradient>
  </defs>

  <!-- Ambient Smart Home Sentinel Shield -->
  <path d="M 60 12 C 86 12 98 25 98 48 C 98 73 60 90 60 90 C 60 90 22 73 22 48 C 22 25 34 12 60 12 Z" fill="url(#shiba-shield-aura)" stroke="#fde68a" stroke-width="0.8" />

  <!-- Iconic Curled Sickle Tail (卷卷尾) -->
  <path d="M 37 63 C 30 57 26 47 31 39 C 36 31 48 33 50 42 C 51 48 44 52 39 49 C 35 46 36 41 39 41 C 41 41 42 43 40 45" fill="none" stroke="url(#shiba-haunch)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Tail White Underside Tip -->
  <path d="M 32 41 C 34 35 44 35 47 41" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" fill="none" />

  <!-- Sitting Hind Flank / Haunch -->
  <path d="M 43 56 C 39 62 36 71 36 78 C 36 82 43 83 48 83 C 54 83 55 79 55 74 C 55 67 52 59 49 55 Z" fill="url(#shiba-haunch)" />

  <!-- Sitting Torso & Back -->
  <path d="M 46 51 C 55 51 70 53 75 61 C 78 66 77 75 77 83 L 49 83 C 47 77 45 70 44 63 Z" fill="url(#shiba-coat)" />

  <!-- Front Pure White Chest (Urajiro) -->
  <path d="M 53 50 C 53 58 55 70 57 83 L 69 83 C 71 73 71 59 67 50 Z" fill="#ffffff" />

  <!-- Front Sitting Paws (Socks) -->
  <rect x="55" y="73.5" width="7" height="9.5" rx="3.5" fill="#ffffff" />
  <rect x="64.5" y="73.5" width="7" height="9.5" rx="3.5" fill="#ffffff" />
  <line x1="57.2" y1="80.5" x2="57.2" y2="83" stroke="#e2e8f0" stroke-width="0.8" />
  <line x1="59.8" y1="80.5" x2="59.8" y2="83" stroke="#e2e8f0" stroke-width="0.8" />
  <line x1="66.7" y1="80.5" x2="66.7" y2="83" stroke="#e2e8f0" stroke-width="0.8" />
  <line x1="69.3" y1="80.5" x2="69.3" y2="83" stroke="#e2e8f0" stroke-width="0.8" />

  <!-- Smart Home Collar & Bell/Pendant -->
  <path d="M 47 50 C 55 53.5 66 53.5 74 50 L 73 53.5 C 65 57 56 57 48 53.5 Z" fill="url(#shiba-collar-grad)" />
  <circle cx="60.5" cy="55.5" r="3" fill="#fbbf24" stroke="#d97706" stroke-width="0.6" />
  <circle cx="60.5" cy="55.5" r="0.9" fill="#78350f" />

  <!-- Ears -->
  <!-- Left Ear -->
  <path d="M 46 31 L 40 16 C 40 15 43 14 45 16 L 54 26 Z" fill="#b45309" />
  <path d="M 46 29 L 42 18 L 51 26 Z" fill="#ffedd5" />
  <!-- Right Ear -->
  <path d="M 75 31 L 81 16 C 81 15 78 14 76 16 L 67 26 Z" fill="#b45309" />
  <path d="M 75 29 L 79 18 L 70 26 Z" fill="#ffedd5" />

  <!-- Round Fluffy Shiba Head Base -->
  <path d="M 42 37 C 38 42 40 50 48 52 C 55 54 66 54 73 52 C 81 50 83 42 79 37 C 77 31 72 25 60.5 25 C 49 25 44 31 42 37 Z" fill="url(#shiba-coat)" />

  <!-- White Cheeks & Muzzle (Urajiro) -->
  <path d="M 44 42 C 42 47 45 51 51 52 C 56 53 65 53 70 52 C 76 51 79 47 77 42 C 74 38 70 39 66 41 C 62 43 59 43 55 41 C 51 39 47 38 44 42 Z" fill="#ffffff" />

  <!-- Soft Coral Blushing Cheeks -->
  <ellipse cx="46" cy="44.5" rx="2.5" ry="1.8" fill="#fca5a5" opacity="0.6" />
  <ellipse cx="75" cy="44.5" rx="2.5" ry="1.8" fill="#fca5a5" opacity="0.6" />

  <!-- Iconic White Eyebrow Dots (豆豆眉) -->
  <ellipse cx="52" cy="31.5" rx="2" ry="1.5" fill="#ffffff" />
  <ellipse cx="69" cy="31.5" rx="2" ry="1.5" fill="#ffffff" />

  <!-- Big Sparkling Smiling Dark Eyes -->
  <ellipse cx="52.5" cy="37" rx="2.2" ry="2.6" fill="#1e293b" />
  <circle cx="53.2" cy="36" r="0.8" fill="#ffffff" />
  <ellipse cx="68.5" cy="37" rx="2.2" ry="2.6" fill="#1e293b" />
  <circle cx="69.2" cy="36" r="0.8" fill="#ffffff" />

  <!-- Black Nose & Happy Shiba Mouth -->
  <path d="M 58.2 42.5 C 58.2 41.5 62.8 41.5 62.8 42.5 C 62.8 44.2 61 45.3 60.5 45.3 C 60 45.3 58.2 44.2 58.2 42.5 Z" fill="#1e293b" />
  <path d="M 60.5 45.3 L 60.5 47 M 60.5 47 C 59 47 57.5 46 57 45.2 M 60.5 47 C 62 47 63.5 46 64 45.2" stroke="#1e293b" stroke-width="1" stroke-linecap="round" fill="none" />
  <!-- Happy Tiny Tongue -->
  <path d="M 59.3 47 C 59.3 49 61.7 49 61.7 47 Z" fill="#f87171" />

  <!-- Ground Horizon Bar -->
  <path d="M 22 83.00 L 98 83.00" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" />

  <!-- Official Brand Typography -->
  <text x="60" y="103" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#78350f" letter-spacing="3">SHIBA</text>
  <text x="60" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="4.5" fill="#d97706" letter-spacing="1.4">― SMART HOME SENTINEL ―</text>
</svg>
