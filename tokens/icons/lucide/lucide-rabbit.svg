<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Parkour Sprinting Agile Rabbit (Ref: VectorStock 64773074) -->
  <!-- 1. Long Swept-Back Ears -->
  <path d="M13.5 7c-1.8-2.2-3.8-4.5-2-5.5 2-1 4.5 2 5.5 4.5" />
  <path d="M15 5.5c1-1.5 2.5-3 4-2.2.8.5.5 2-.5 3.2" />
  <!-- 2. Streamlined Body from Head to Nose, Chest, Front Paws, Belly, Thigh & Rear Leg -->
  <!-- Nose & Head down to Chest -->
  <path d="M17 6c1.5 0 2.8.8 3.5 2 .5 1-.2 2-1.5 2.5" />
  <!-- Front Paw reaching forward in sprint -->
  <path d="M18.5 10.5h3.5c.8 0 1 .8.2 1.2l-3.7 1.3" />
  <!-- Streamlined Aerodynamic Back from Neck to Rump -->
  <path d="M14 7c-2.5-.2-5-.5-8 0-1.8.3-3.2 1.5-3.8 3.2" />
  <!-- Powerful Rear Leg kicking straight back -->
  <path d="M5.5 11.5c-.8 1.5-2 3.5-3.5 4.5-.8.5-.8 1.2 0 1.2 1.5 0 3.2-1.2 4.5-2.5l2-1.2" />
  <!-- Underbelly Contour -->
  <path d="M10.5 13.5c2 0 4.5-.8 6.5-1.5" />
  <!-- Fluffy Upright Tail (Ref: 64773074) -->
  <path d="M5.5 9.5c-.8-.8-1.5-1.8-.5-2.2 1-.5 1.8.8 2 1.8" />
  <!-- Eye -->
  <circle cx="17.8" cy="8" r=".7" fill="currentColor" stroke="none" />
</svg>