<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Elephant Head with Leaf Trunk Spout (Ref: VectorStock 38061786) -->
  <!-- Ear & Head Contour -->
  <path d="M 11.5 9.5
           C 13 7, 16.5 6, 19.5 8
           C 22 10.2, 22 14, 19.5 17.5
           C 17.2 20.2, 14.5 20.5, 13.2 18
           C 12 16, 11 16.5, 10 17" />
  <!-- Curved Trunk Uplifting (U-hook) -->
  <path d="M 11.5 9.5
           C 9.8 11, 8 13, 8 15.8
           C 8 18.5, 10.5 18.5, 11.5 16.8
           C 12.2 15.5, 11.8 13.8, 11 12.8" />
  <!-- Lower Jaw / Neck Line -->
  <path d="M 10 17 C 11.2 18, 13.2 18, 13.8 17" />
  <!-- Spouting Leaf 1: Top Center -->
  <path d="M 9.5 2.5 C 8.2 4, 8.8 5.8, 9.5 6.5 C 10.2 5.8, 10.8 4, 9.5 2.5 Z" fill="currentColor" stroke="none" />
  <!-- Spouting Leaf 2: Upper Left -->
  <path d="M 6.2 4.2 C 5 5.5, 5.5 7.2, 6.5 7.8 C 7.2 7.2, 7.8 5.5, 6.2 4.2 Z" fill="currentColor" stroke="none" />
  <!-- Spouting Leaf 3: Upper Right -->
  <path d="M 13 4.2 C 14.2 5.5, 13.8 7.2, 12.8 7.8 C 12 7.2, 11.5 5.5, 13 4.2 Z" fill="currentColor" stroke="none" />
  <!-- Spouting Leaf 4: Far Left Droplet -->
  <path d="M 4.2 7.5 C 3.2 8.5, 3.8 9.8, 4.8 10 C 5.2 9.5, 5.5 8.5, 4.2 7.5 Z" fill="currentColor" stroke="none" />
  <!-- Eye -->
  <circle cx="13.5" cy="11.8" r="0.9" fill="currentColor" />
</svg>