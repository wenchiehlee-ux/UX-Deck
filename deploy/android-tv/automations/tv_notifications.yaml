          {"duration":25,"position":0,"backgroundColor":"#00000000","title":"","message":"","media":{"image":{"uri":"http://192.168.31.101:8123/local/ux-deck/huds/dryer_done.png","width":480}}}

# ------------------------------------------------------------------------------
# 5. 家庭行事曆日程提醒 (TimeTree Calendar Alert)
# ------------------------------------------------------------------------------
- id: "tv_notify_calendar_schedule"
  alias: "TV HUD: 今日日程提醒"
  description: "全天行程（早上08:00）、日曆事件即將開始（前15分鐘）、或上午電視開機時主動於客廳電視推播"
  trigger:
    # 觸發情境 A：每日晨間固定排程
    - platform: time
      at: "08:00:00"
      id: "morning_schedule"
    # 觸發情境 B：日曆事件即將開始前 15 分鐘動態觸發
    - platform: calendar
      event: start
      offset: "-00:15:00"
      entity_id: calendar.timetree  # 部署平台對齊實體：TimeTree
      id: "calendar_upcoming_event"
    # 觸發情境 C：日曆事件正式開始當下即時觸發
    - platform: calendar
      event: start
      offset: "00:00:00"
      entity_id: calendar.timetree
      id: "calendar_event_start_now"
    # 觸發情境 D：上午電視開機喚醒時，若今天有排程則主動播報
    - platform: state
      entity_id: media_player.ke_ting_de_dian_shi
      to: "on"
      id: "tv_morning_turn_on"
  condition:
    # 電視開機時僅在上午 07:00 ~ 12:00 播報一次，避免深夜開電視被打擾
    - condition: or
      conditions:
        - condition: trigger
          id: ["morning_schedule", "calendar_upcoming_event", "calendar_event_start_now"]
        - condition: and
          conditions:
            - condition: trigger
              id: "tv_morning_turn_on"
            - condition: time
              after: "07:00:00"
              before: "12:00:00"
  action:
    # 【方案 B 首選】：極致美感 18px 圓角動態毛玻璃 HUD (帶入真實行程名稱與時間)
    - service: shell_command.render_calendar_hud
      continue_on_error: true
      data:
        title: >-
          {% if trigger.id == 'calendar_event_start_now' %}行程現在開始 🔔{% else %}今日行程提醒 📅{% endif %}
        message: >-
          {% if trigger.id == 'calendar_event_start_now' %}
            活動開始：{{ trigger.calendar_event.summary | default('今日行程') }} ({{ as_timestamp(trigger.calendar_event.start) | timestamp_custom('%H:%M') }}~{{ as_timestamp(trigger.calendar_event.end) | timestamp_custom('%H:%M') }}) ⏰
          {% elif trigger.id == 'calendar_upcoming_event' %}
            15分鐘後：{{ trigger.calendar_event.summary | default('今日行程') }} ({{ as_timestamp(trigger.calendar_event.start) | timestamp_custom('%H:%M') }}~{{ as_timestamp(trigger.calendar_event.end) | timestamp_custom('%H:%M') }}) ⏰
          {% else %}
            今日行程提醒 ⏰
          {% endif %}
    - service: rest_command.pipup_notify_1f
      continue_on_error: true
      data:
        payload_json: >-
          {"duration":60,"position":0,"backgroundColor":"#00000000","title":"","message":"","media":{"image":{"uri":"http://192.168.31.101:8123/local/ux-deck/huds/calendar_event.png?ts={{ as_timestamp(now()) }}","width":480}}}
    - service: rest_command.pipup_notify_2f
      continue_on_error: true
      data:
        payload_json: >-
          {"duration":30,"position":0,"backgroundColor":"#00000000","title":"","message":"","media":{"image":{"uri":"http://192.168.31.101:8123/local/ux-deck/huds/calendar_event.png?ts={{ as_timestamp(now()) }}","width":480}}}

# ------------------------------------------------------------------------------
# 6. 設備低電量警告 (Battery Low Warning)
# ------------------------------------------------------------------------------
- id: "tv_notify_battery_low"
  alias: "TV HUD: 設備電量警告"
  description: "客廳夜燈或感測器電量低於 10% 時於電視警示"
  trigger:
    - platform: numeric_state
      entity_id: sensor.nightlight_battery
      below: 10
  action:
    - service: rest_command.pipup_notify_1f
      data:
        payload_json: >-
          {"duration":20,"position":0,"backgroundColor":"#00000000","title":"","message":"","media":{"image":{"uri":"http://192.168.31.101:8123/local/ux-deck/huds/battery_low.png","width":480}}}

# ------------------------------------------------------------------------------
# 7. 外送到達提醒 (Foodpanda Delivery Alert)
# ------------------------------------------------------------------------------
- id: "tv_notify_foodpanda_delivery"
  alias: "TV HUD: 外送到達提醒"
  description: "外送員抵達時於電視右上角推播亮橘 HUD"
  trigger:
    - platform: state
      entity_id: sensor.foodpanda_order_status
      to: "arrived"
  action:
    - service: rest_command.pipup_notify_1f
      data:
        payload_json: >-
          {"duration":30,"position":0,"backgroundColor":"#00000000","title":"","message":"","media":{"image":{"uri":"http://192.168.31.101:8123/local/ux-deck/huds/delivery.png","width":480}}}

