# ==============================================================================
# Home Assistant Automations: Android TV 10-Foot Frosted HUD (PiPup)
# File: deploy/android-tv/automations/tv_notifications.yaml
# Production Standard: 60% Translucent Dark Slate with 18px True Rounded Corners
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 訪客門鈴即時提醒 (Doorbell Visitor Alert)
# ------------------------------------------------------------------------------
- id: "tv_notify_doorbell_visitor"
  alias: "TV HUD: 門鈴訪客即時提醒"
  description: "當門鈴觸發或玄關偵測到訪客時，於客廳 Android TV 顯示 15 秒 18px 圓角毛玻璃 HUD"
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door_doorbell
      to: "on"
  action:
    # 【方案 B 首選】：極致美感 18px 圓角透明 HUD (零白框、完美穿透電視畫面)
    - service: rest_command.pipup_notify_1f
      data:
        payload_json: >-
          {"duration":15,"position":0,"backgroundColor":"#00000000","title":"","message":"","media":{"image":{"uri":"http://192.168.31.101:8123/local/ux-deck/huds/doorbell.png","width":480}}}
    - service: rest_command.pipup_notify_2f
      data:
        payload_json: >-
          {"duration":15,"position":0,"backgroundColor":"#00000000","title":"","message":"","media":{"image":{"uri":"http://192.168.31.101:8123/local/ux-deck/huds/doorbell.png","width":480}}}

# ------------------------------------------------------------------------------
# 2. 洗衣機完成提醒 (Washer Complete Toast)
# ------------------------------------------------------------------------------
- id: "tv_notify_washer_complete"
  alias: "TV HUD: 洗衣完成提醒"
  description: "洗衣機清洗完畢時，於電視右上角推播綠色完成狀態 HUD"
  trigger:
    - platform: state
      entity_id: sensor.xi_yi_ji_current_status
      to: "complete"
  action:
    - service: rest_command.pipup_notify_1f
      data:
        payload_json: >-
          {"duration":25,"position":0,"backgroundColor":"#00000000","title":"","message":"","media":{"image":{"uri":"http://192.168.31.101:8123/local/ux-deck/huds/washer_done.png","width":480}}}
    - service: rest_command.pipup_notify_2f
      data:
        payload_json: >-
          {"duration":25,"position":0,"backgroundColor":"#00000000","title":"","message":"","media":{"image":{"uri":"http://192.168.31.101:8123/local/ux-deck/huds/washer_done.png","width":480}}}

# ------------------------------------------------------------------------------
# 3. 洗衣機運轉進度 (Washer Running Status)
# ------------------------------------------------------------------------------
- id: "tv_notify_washer_running"
  alias: "TV HUD: 洗衣機運轉進度"
  description: "洗衣機運轉中階段推播冰晶藍進度通知"
  trigger:
    - platform: state
      entity_id: sensor.xi_yi_ji_current_status
      to: "running"
  action:
    - service: rest_command.pipup_notify_1f
      data:
        payload_json: >-
          {"duration":15,"position":0,"backgroundColor":"#00000000","title":"","message":"","media":{"image":{"uri":"http://192.168.31.101:8123/local/ux-deck/huds/washer_running.png","width":480}}}

# ------------------------------------------------------------------------------
# 4. 乾衣完成提醒 (Dryer Complete Toast)
# ------------------------------------------------------------------------------
- id: "tv_notify_dryer_complete"
  alias: "TV HUD: 乾衣完成提醒"
  description: "乾衣機烘乾程序結束時，於電視右上角推播溫暖橘金 HUD"
  trigger:
    - platform: state
      entity_id: sensor.gan_yi_ji_current_status
      to: "complete"
  action:
    - service: rest_command.pipup_notify_1f
      data:
        payload_json: >-
          {"duration":25,"position":0,"backgroundColor":"#00000000","title":"","message":"","media":{"image":{"uri":"http://192.168.31.101:8123/local/ux-deck/huds/dryer_done.png","width":480}}}

# ------------------------------------------------------------------------------
# 5. 家庭行事曆日程提醒 (TimeTree Calendar Alert)
# ------------------------------------------------------------------------------
- id: "tv_notify_calendar_schedule"
  alias: "TV HUD: 今日日程提醒"
  description: "全天行程（早上08:00）或即將到來事件於電視推播"
  trigger:
    - platform: time
      at: "08:00:00"
  action:
    - service: rest_command.pipup_notify_1f
      data:
        payload_json: >-
          {"duration":20,"position":0,"backgroundColor":"#00000000","title":"","message":"","media":{"image":{"uri":"http://192.168.31.101:8123/local/ux-deck/huds/calendar.png","width":480}}}

# ------------------------------------------------------------------------------
# 6. 設備低電量警告 (Battery Low Warning)
# ------------------------------------------------------------------------------
- id: "tv_notify_battery_low"
  alias: "TV HUD: 設備電量警告"
  description: "客廳夜燈或感測器電量低於 10% 時於電視警示"
  trigger:
    - platform: numeric_state
      entity_id: sensor.nightlight_battery
      below: 10
  action:
    - service: rest_command.pipup_notify_1f
      data:
        payload_json: >-
          {"duration":20,"position":0,"backgroundColor":"#00000000","title":"","message":"","media":{"image":{"uri":"http://192.168.31.101:8123/local/ux-deck/huds/battery_low.png","width":480}}}

# ------------------------------------------------------------------------------
# 7. 外送到達提醒 (Foodpanda Delivery Alert)
# ------------------------------------------------------------------------------
- id: "tv_notify_foodpanda_delivery"
  alias: "TV HUD: 外送到達提醒"
  description: "外送員抵達時於電視右上角推播亮橘 HUD"
  trigger:
    - platform: state
      entity_id: sensor.foodpanda_order_status
      to: "arrived"
  action:
    - service: rest_command.pipup_notify_1f
      data:
        payload_json: >-
          {"duration":30,"position":0,"backgroundColor":"#00000000","title":"","message":"","media":{"image":{"uri":"http://192.168.31.101:8123/local/ux-deck/huds/delivery.png","width":480}}}

