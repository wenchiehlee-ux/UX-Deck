# ==============================================================================
# Home Assistant Automations & Scripts: Android TV 10-foot HUD Notifications
# Path in HA: /config/automations/tv_notifications.yaml
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 門鈴偵測與即時快照提醒 (Doorbell / Front Door Visitor Popup)
# ------------------------------------------------------------------------------
- id: "tv_notify_doorbell_visitor"
  alias: "TV HUD: 門鈴訪客即時提醒"
  description: "當門鈴觸發或玄關偵測到訪客時，於客廳 Android TV 顯示 8 秒毛玻璃 HUD 通知"
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door_doorbell # 請替換為您的門鈴感測實體
      to: "on"
  action:
    # 方案 A: 使用 Notifications for Android TV (NFATV 廣播)
    - service: notify.android_tv_living_room # 請替換為您的 Android TV notify 實體名稱
      data:
        title: "客廳守護犬提醒 🐕 · 玄關訪客"
        message: "大門有人按門鈴，門鎖維持安全上鎖狀態。"
        data:
          duration: 8
          position: "top-right"
          fontsize: "large"
          transparency: "20%"
          color: "#0a0c12"
          interrupt: false
          icon:
            url: "/local/ux-deck/animal-icons.svg#icon-sentinel-tv"

    # 方案 B: 使用 PiPup (已在 1F Android TV 實測驗證的最佳化 10-Foot HUD 參數)
    # - service: rest_command.pipup_notify_1f
    #   data:
    #     title: "玄關訪客叮咚 🔔"
    #     message: "大門有人按門鈴，門鎖維持安全上鎖狀態 🐾"
    #     duration: 15
    #     image_width: 80

# ------------------------------------------------------------------------------
# 2. 家電運作完畢提醒 (Laundry / Dishwasher Complete Toast)
# ------------------------------------------------------------------------------
- id: "tv_notify_laundry_complete"
  alias: "TV HUD: 洗衣機清洗完畢"
  description: "洗衣機清洗完畢時，在電視右上角低干擾提示"
  trigger:
    - platform: state
      entity_id: sensor.washing_machine_status # 請替換為您的家電感測實體
      to: "finish"
  action:
    - service: notify.android_tv_living_room
      data:
        title: "智慧家電提示 🧺"
        message: "洗衣機清洗程序已完成，請記得晾曬衣物。"
        data:
          duration: 6
          position: "top-right"
          fontsize: "medium"
          transparency: "20%"
          color: "#0a0c12"
          interrupt: false

# ------------------------------------------------------------------------------
# 3. 客廳安全守護夜間警戒 (Security Night Sentinel Alert)
# ------------------------------------------------------------------------------
- id: "tv_notify_perimeter_alert"
  alias: "TV HUD: 周邊警戒警報"
  description: "夜間庭院或後門感測器觸發時的高對比警報"
  trigger:
    - platform: state
      entity_id: binary_sensor.backyard_motion
      to: "on"
  condition:
    - condition: state
      entity_id: sun.sun
      state: "below_horizon"
  action:
    - service: notify.android_tv_living_room
      data:
        title: "⚠️ 周邊警戒偵測"
        message: "後院感應燈已觸發，偵測到動態移動。"
        data:
          duration: 12
          position: "top-right"
          fontsize: "large"
          transparency: "10%"
          color: "#7f1d1d" # 警示深紅
          interrupt: true

